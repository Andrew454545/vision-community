name = "vision-community"
main = "src/worker.js"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# D1 holds the prototype ledger. INDEX is the durable sealed-segment copy.
# Production 200M search will not run in this Worker. Do not bind any other bucket.

[[d1_databases]]
binding = "DB"
database_name = "vision-community"
database_id = "ed4705fa-1190-41fa-86a0-02d755db1b2a"

[[r2_buckets]]
binding = "INDEX"
bucket_name = "vision-community"

[assets]
directory = "../../community/web"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true
