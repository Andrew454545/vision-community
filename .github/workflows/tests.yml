name: tests

on:
  push:
    branches: [main, codex/windows-production-readiness]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s community/tests -q

  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Windows unit tests
        shell: pwsh
        run: |
          $env:VISION_TEST_POWERSHELL = Join-Path $PSHOME "pwsh.exe"
          python -B -m unittest discover -s community/tests -q

  mac-process-ownership:
    # Exercise actual Mac timeout/parent-exit cleanup with finite fixtures.
    # No models, private reference packet, imagery, account or service access.
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Mac native process ownership and preserved failures
        shell: bash
        run: python -B -m unittest community.tests.test_process_owner -v 2>&1 | tee "$RUNNER_TEMP/process-ownership.log"
      - name: Preserve finite ownership diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-process-ownership-evidence
          path: ${{ runner.temp }}/process-ownership.log
          retention-days: 7
          if-no-files-found: warn

  mac-private-starter:
    # Exercise the private bootstrap on a real Apple-silicon Mac. No account,
    # models, live imagery, reference packet, contributions or service writes.
    runs-on: macos-26
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify private Mac Python and HTTPS
        shell: bash
        run: |
          # Simulate files retained after an interrupted earlier extraction.
          mkdir -p "$RUNNER_TEMP/mac-starter-private/python-staging-interrupted/python/bin"
          printf 'preserved interrupted setup\n' > "$RUNNER_TEMP/mac-starter-private/python-staging-interrupted/python/bin/python3.14"
          /bin/bash --noprofile --norc './Start VISION.command' --accept-downloads --python-only --root "$RUNNER_TEMP/mac-starter-private" 2>&1 | tee "$RUNNER_TEMP/mac-private-python.log"
          test "$(cat "$RUNNER_TEMP/mac-starter-private/python-staging-interrupted/python/bin/python3.14")" = 'preserved interrupted setup'
          printf 'Interrupted extraction preserved; fresh verified interpreter used.\n' | tee -a "$RUNNER_TEMP/mac-private-python.log"
      - name: Verify the public-source-only private snapshot
        shell: bash
        run: |
          /bin/bash --noprofile --norc './Start VISION.command' --accept-downloads --snapshot-only --root "$RUNNER_TEMP/mac-starter-private" 2>&1 | tee "$RUNNER_TEMP/mac-private-source.log"
      - name: Exercise source, interpreter and platform qualification guards
        shell: bash
        run: |
          private="$RUNNER_TEMP/mac-starter-private/python-3.14.8-20261003-arm64/python"
          export SSL_CERT_FILE="$private/lib/python3.14/site-packages/pip/_vendor/certifi/cacert.pem"
          "$private/bin/python3.14" -I -B -c 'import sys,unittest;sys.path.insert(0,"."); suite=unittest.defaultTestLoader.loadTestsFromNames(["community.tests.test_mac_starter","community.tests.test_canary_released_dataset","community.tests.test_desktop_progress","community.tests.test_mac_launch_agent","community.tests.test_work_plan","community.tests.test_guided_lanes"]); result=unittest.TextTestRunner(verbosity=2).run(suite);sys.exit(not result.wasSuccessful())' 2>&1 | tee "$RUNNER_TEMP/mac-private-guards.log"
      - name: Open and close the actual private local window
        shell: bash
        run: |
          private="$RUNNER_TEMP/mac-starter-private/python-3.14.8-20261003-arm64/python"
          export SSL_CERT_FILE="$private/lib/python3.14/site-packages/pip/_vendor/certifi/cacert.pem"
          "$private/bin/python3.14" -I -B macos/check-starter.py --root "$RUNNER_TEMP/mac-starter-private" --report "$RUNNER_TEMP/mac-private-window.json"
      - name: Verify private service errors, Object payloads and saved-work recovery
        shell: bash
        run: |
          private="$RUNNER_TEMP/mac-starter-private/python-3.14.8-20261003-arm64/python"
          "$private/bin/python3.14" -I -B -c 'import sys,unittest;sys.path.insert(0,"."); suite=unittest.defaultTestLoader.loadTestsFromNames(["community.tests.test_client_error_privacy","community.tests.test_service_transport","community.tests.test_background_http_recovery","community.tests.test_object_delivery","community.tests.test_submission_outbox","community.tests.test_object_index.ObjectIndexTest.test_object_transport_preserves_contract_without_private_native_paths","community.tests.test_object_index.ObjectIndexTest.test_optional_object_evidence_paths_are_private_but_policy_and_digests_survive","community.tests.test_object_index.ObjectIndexTest.test_transport_redaction_cannot_hide_invalid_or_live_source_paths"]); result=unittest.TextTestRunner(verbosity=2).run(suite);sys.exit(not result.wasSuccessful())' 2>&1 | tee "$RUNNER_TEMP/mac-private-client-recovery.log"
      - name: Verify real Mac idle-sleep ownership and abrupt exit
        shell: bash
        run: |
          private="$RUNNER_TEMP/mac-starter-private/python-3.14.8-20261003-arm64/python"
          "$private/bin/python3.14" -I -B -c 'import sys,unittest;sys.path.insert(0,"."); suite=unittest.defaultTestLoader.loadTestsFromNames(["community.tests.test_mac_sleep_request","community.tests.test_sleep_request","community.tests.test_background"]); result=unittest.TextTestRunner(verbosity=2).run(suite);sys.exit(not result.wasSuccessful())' 2>&1 | tee "$RUNNER_TEMP/mac-private-sleep.log"
      - name: Exercise finite Mac scheduled worker recovery
        shell: bash
        run: |
          private="$RUNNER_TEMP/mac-starter-private/python-3.14.8-20261003-arm64/python"
          "$private/bin/python3.14" -I -B macos/check-background.py --root "$RUNNER_TEMP/mac-starter-private" --report "$RUNNER_TEMP/mac-scheduled-recovery.json"
      - name: Verify guarded Mac registration, controls and safe handover
        shell: bash
        run: |
          private="$RUNNER_TEMP/mac-starter-private/python-3.14.8-20261003-arm64/python"
          "$private/bin/python3.14" -I -B -c 'import sys,unittest;sys.path.insert(0,"."); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName("community.tests.test_mac_background"));sys.exit(not result.wasSuccessful())' 2>&1 | tee "$RUNNER_TEMP/mac-background-control-guards.log"
          "$private/bin/python3.14" -I -B macos/check-background-controls.py --root "$RUNNER_TEMP/mac-starter-private" --report "$RUNNER_TEMP/mac-background-controls.json"
      - name: Preserve aggregate Mac starter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-private-starter-evidence
          path: |
            ${{ runner.temp }}/mac-private-python.log
            ${{ runner.temp }}/mac-private-source.log
            ${{ runner.temp }}/mac-private-guards.log
            ${{ runner.temp }}/mac-private-window.json
            ${{ runner.temp }}/mac-private-client-recovery.log
            ${{ runner.temp }}/mac-private-sleep.log
            ${{ runner.temp }}/mac-scheduled-recovery.json
            ${{ runner.temp }}/mac-background-control-guards.log
            ${{ runner.temp }}/mac-background-controls.json
          retention-days: 7
          if-no-files-found: warn

  cloudflare-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install private Worker test tools
        working-directory: deploy/cloudflare
        run: npm install --no-save --package-lock=false --ignore-scripts wrangler@4.144.0 miniflare@5.20260926.1-alpha
      - name: Run worker scene gate tests
        run: node --test deploy/cloudflare/src/*.test.mjs deploy/cloudflare/scene-verifier/*.test.mjs deploy/cloudflare/native-scene-bridge/*.test.mjs deploy/cloudflare/native-scene-verifier-bridge/*.test.mjs deploy/cloudflare/native-container-host/*.test.mjs
      - name: Check the complete Worker in the Cloudflare runtime
        working-directory: deploy/cloudflare
        run: |
          node tools/check-staging-config.mjs
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir "$PWD/.local-test-build"
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.staging.jsonc --outdir "$PWD/.local-staging-build"
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config native-scene-bridge/wrangler.toml --outdir "$PWD/.local-native-bridge-build"
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config native-scene-verifier-bridge/wrangler.toml --outdir "$PWD/.local-verifier-bridge-build"
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config native-container-host/wrangler.jsonc --outdir "$PWD/.local-native-host-build"
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config native-container-host/private-check.wrangler.jsonc --outdir "$PWD/.local-private-check-build"
          node tools/check-local-runtime.mjs node_modules/miniflare/dist/src/index.js .local-test-build/worker.js
          node tools/check-local-api-protection.mjs node_modules/miniflare/dist/src/index.js .local-test-build/worker.js
          node tools/check-staging-scene-policy.mjs node_modules/miniflare/dist/src/index.js .local-test-build/worker.js
          node tools/check-local-verifier-replies.mjs node_modules/miniflare/dist/src/index.js .local-test-build/worker.js
          node tools/check-local-deletion-archive.mjs node_modules/miniflare/dist/src/index.js .local-test-build/worker.js
          node tools/check-local-maintenance.mjs node_modules/miniflare/dist/src/index.js .local-test-build/worker.js
          node tools/check-local-restore-sql.mjs node_modules/miniflare/dist/src/index.js
          node tools/check-local-schema-upgrade.mjs node_modules/miniflare/dist/src/index.js
          node tools/check-local-verifier.mjs node_modules/miniflare/dist/src/index.js
          node tools/check-local-native-host.mjs node_modules/miniflare/dist/src/index.js .local-native-host-build/worker.js
          node tools/check-local-native-idle.mjs node_modules/miniflare/dist/src/index.js .local-native-host-build/worker.js
          node tools/check-local-native-checker.mjs node_modules/miniflare/dist/src/index.js .local-private-check-build/private-native-host-check.js
