name: mac app lifecycle
on:
  pull_request:
  push:
    branches: [main, codex/windows-production-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-lifecycle:
    # Actual per-user app install, open/quit, repeat, repair, update and
    # removal on a disposable runner account, using two built revisions and
    # synthetic private files. No consent, account, service, model or imagery.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify temporary signing keychain failure cleanup without real credentials
        shell: bash
        run: python -B packaging/check_mac_signing_cleanup.py | tee "$RUNNER_TEMP/mac-signing-cleanup-report.json"
      - name: Build the checked revision and a synthetic update revision
        shell: bash
        run: |
          python -B packaging/build_mac.py --output "$RUNNER_TEMP/mac-a" --revision "$GITHUB_SHA"
          # A local empty commit gives the update a different revision; nothing is pushed.
          git -c user.name=lifecycle -c user.email=lifecycle@invalid commit --allow-empty -q -m 'Synthetic update revision for lifecycle CI'
          python -B packaging/build_mac.py --output "$RUNNER_TEMP/mac-b" --revision "$(git rev-parse HEAD)"
      - name: Install, open, repeat, repair, update and remove the app
        shell: bash
        env:
          VISION_DISPOSABLE_LIFECYCLE: '1'
        run: |
          python -B packaging/check_mac_lifecycle.py \
            --archive-a "$RUNNER_TEMP/mac-a/MAINTAINER-UNSIGNED-VISION-Mac.zip" \
            --archive-b "$RUNNER_TEMP/mac-b/MAINTAINER-UNSIGNED-VISION-Mac.zip" \
            --report "$RUNNER_TEMP/mac-lifecycle-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-lifecycle-evidence
          path: |
            ${{ runner.temp }}/mac-lifecycle-report.json
            ${{ runner.temp }}/mac-signing-cleanup-report.json
          retention-days: 14
          if-no-files-found: warn
